[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tomate"
version = "0.1.0"
description = "Driver userspace e app de configuração para a mesa TOMATE MTM-1106 (08f2:6811)"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["jeepney>=0.8"]

[project.optional-dependencies]
gui = ["PySide6>=6.6"]
dev = ["pytest>=8"]

[project.scripts]
tomate-daemon = "tomate.daemon:main"

[project.gui-scripts]
tomate-gui = "tomate.gui.app:main"

[tool.setuptools.packages.find]
include = ["tomate*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
